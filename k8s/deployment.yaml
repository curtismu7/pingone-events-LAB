# The SE deployment of PingOne Events Lab. OWNER-APPROVED EXCEPTION (2026-11-07): this one app runs on the SE cluster so PingOne's cloud can
# reach its webhook, in Real mode, from the SAME image as the local Docker standalone (no fork, one Dockerfile). Hosted mode fails closed:
# the pod will not start without the webhook credential and the page credential, which come from the Secret named below (never from the repo).
# Placeholders (__IMAGE__, __SE_HOST__, __UI_HOST__) are filled by k8s/deploy.sh; nothing here names a real host or registry path.
# Single replica with a Recreate rollout: the events file lives on a ReadWriteOnce volume, so two pods must never run at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingone-events-lab
  labels: { app: pingone-events-lab }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: pingone-events-lab }
  template:
    metadata:
      labels: { app: pingone-events-lab }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7802 }
          env:
            - { name: PEV_HOSTED, value: "1" }
            - { name: PORT, value: "7802" }
            - { name: PEV_BIND, value: 0.0.0.0 }
            - { name: PEV_DATA_DIR, value: /data }
            # The page's own host and the host PingOne posts to. The ingress also rewrites Host to loopback (upstream-vhost), so these are a second
            # line of defence; hosted mode never relies on Host to decide who is calling.
            - { name: LAB_ALLOWED_HOSTS, value: __UI_HOST__ }
            - { name: WEBHOOK_ALLOWED_HOSTS, value: __SE_HOST__ }
            # Every PingOne delivery arrives from a few addresses: allow more per minute than the local default of 120. Unauthenticated requests have their
            # own small per-address allowance, so a flood cannot use this one up.
            - { name: PEV_WEBHOOK_RPM, value: "600" }
            # Trust exactly one proxy hop for the client address (the ingress appends it to X-Forwarded-For; the app uses only the right-most entry).
            - { name: PEV_TRUST_PROXY_HOPS, value: "1" }
          # The credentials and the PingOne / Elasticsearch settings. The Secret must exist (the pod fails to start without it); see k8s/secret.example.yaml.
          envFrom:
            - secretRef: { name: pingone-events-lab }
          # The probes send a loopback Host header because the app's Host check refuses the pod IP; /api/health is the one open endpoint.
          readinessProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "127.0.0.1:7802" }] }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "127.0.0.1:7802" }] }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pingone-events-lab-data }
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }

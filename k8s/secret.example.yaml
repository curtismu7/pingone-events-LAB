# A TEMPLATE. Never apply this file and never put real values in it: deploy.sh does not read it. The owner creates the real Secret, for example:
#   kubectl -n <namespace> create secret generic pingone-events-lab \
#     --from-literal=WEBHOOK_BASIC_USER=... --from-literal=WEBHOOK_BASIC_PASSWORD=... \
#     --from-literal=UI_BASIC_USER=... --from-literal=UI_BASIC_PASSWORD=...  [--from-literal=KEY=... for the optional ones]
# Every key becomes an environment variable of the pod. DELETE the keys you do not use. In a hosted deployment the app REFUSES TO START when any
# of these keys still holds the placeholder text REPLACE-ME, when the PingOne or Elasticsearch settings are only partly set or invalid, or when the
# webhook and page credentials are the same secret (it names the key, never the value): it fails closed instead of running half-configured.
apiVersion: v1
kind: Secret
metadata:
  name: pingone-events-lab
  labels: { app: pingone-events-lab }
type: Opaque
stringData:
  # REQUIRED. What PingOne sends with every delivery (HTTP Basic). 12+ characters for the password. Put the same pair in the PingOne subscription.
  WEBHOOK_BASIC_USER: REPLACE-ME-webhook-user
  WEBHOOK_BASIC_PASSWORD: REPLACE-ME-a-long-random-webhook-password
  # REQUIRED. What a person types to open the page. A DIFFERENT credential from the webhook's.
  UI_BASIC_USER: REPLACE-ME-page-user
  UI_BASIC_PASSWORD: REPLACE-ME-a-long-random-page-password
  # Alternative or extra webhook credential: a static header instead of (or beside) Basic.
  # WEBHOOK_HEADER_NAME: x-webhook-key
  # WEBHOOK_HEADER_VALUE: REPLACE-ME-a-long-random-header-value
  # OPTIONAL: the read-only pull. A worker app that can read subscriptions and activities.
  # PINGONE_ENVIRONMENT_ID: REPLACE-ME-environment-uuid
  # PINGONE_REGION: com
  # PINGONE_CLIENT_ID: REPLACE-ME-client-uuid
  # PINGONE_CLIENT_SECRET: REPLACE-ME-client-secret
  # OPTIONAL: forward each event to your Elasticsearch or OpenSearch (still switched OFF in the page until the owner turns it on).
  # ELASTICSEARCH_URL: https://your-cluster.example:9200
  # ELASTICSEARCH_API_KEY: REPLACE-ME-api-key
  # ELASTICSEARCH_INDEX: pingone-events
